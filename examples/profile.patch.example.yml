# Example profile override for dsh-plugin-custom-headers.
#
# Copy this block into ~/.dsh/profiles/<profile>/cordis.patch.yml. The bundle
# already inserts a `CustomHeaders` row; an entry with the same id and name
# replaces that row's complete config, so this is the place for device-specific
# endpoints, credential references and model catalogs.
#
# Keep real API keys out of this file: `apiKeyEnv` is only a reference name.
# Store the key itself per device through Settings → Custom Headers or a matching
# environment variable.
- id: CustomHeaders
  name: dsh-plugin-custom-headers
  config:
    providers:
      my-openai:
        displayName: my-openai
        api: openai-responses
        baseURL: https://gateway.example.com/v1
        apiKeyEnv: MY_OPENAI_API_KEY
        headers:
          User-Agent: claude-cli/2.1.303 (external, cli)
        models:
          - id: my-model
            name: My Model
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
      my-anthropic:
        displayName: my-anthropic
        api: anthropic-messages
        baseURL: https://gateway.example.com
        apiKeyEnv: MY_ANTHROPIC_API_KEY
        headers:
          User-Agent: claude-cli/2.1.303 (external, cli)
        models:
          - id: my-claude
            name: My Claude
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              medium: medium
              high: high
              max: max
